name: Criar APK do Voxali

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar ambiente
        run: |
          java -version
          gradle --version

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Voxali.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxali-APK
          path: release/Voxali.apk
          if-no-files-found: error
